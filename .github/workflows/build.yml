name: Build NEURIX desktop installers
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist:${{ matrix.platform }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: neurix-${{ matrix.platform }}-installer
          path: release/*
          if-no-files-found: error
